name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: azure/setup-helm@v4
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: CHARTDELTA_REAL_HELM=1 pytest -q
